plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasReleaseSigningProperties = releaseSigningKeys.every {
    keystoreProperties[it] != null && !keystoreProperties[it].toString().trim().isEmpty()
}
def releaseKeystoreFile = hasReleaseSigningProperties
        ? file(keystoreProperties['storeFile'])
        : null
def hasReleaseSigning = releaseKeystoreFile != null && releaseKeystoreFile.exists()

android {
    namespace = "com.wmstudios.blossom"
    compileSdk = flutter.compileSdkVersion
    // Pin NDK r27 (highest installed); r28+ gives automatic 16KB ELF alignment
    // for code compiled from source, upgrade when r28 is installed.
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId = "com.wmstudios.blossom"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseKeystoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Local release-mode runs should not require access to the private
            // publishing key. Use it when configured; otherwise use Android's
            // debug key so `flutter run --release` remains installable.
            signingConfig hasReleaseSigning
                    ? signingConfigs.release
                    : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

// Copy APK to Flutter's expected location
android.applicationVariants.all { variant ->
    variant.assembleProvider.get().doLast {
        variant.outputs.all { output ->
            def outputDir = output.outputFile.parentFile
            def flutterApkDir = file("${project.rootDir}/../build/app/outputs/flutter-apk")
            flutterApkDir.mkdirs()
            
            copy {
                from outputDir
                into flutterApkDir
                include '*.apk'
            }
        }
    }
}
